<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1, maximum-scale=1,user-scalable=no" />
  <title>Editing</title>

  <style>
    html,
    body {
      padding: 0;
      margin: 0;
      height: 100%;
      width: 100%;
    }
  </style>
  <!-- Load Calcite components from CDN -->
  <link rel="stylesheet" type="text/css" href="https://js.arcgis.com/calcite-components/3.0.0-next.120/calcite.css" />
  <script type="module" src="https://js.arcgis.com/calcite-components/3.0.0-next.120/calcite.esm.js"></script>

  <!-- Load the ArcGIS Maps SDK for JavaScript from CDN -->
  <link rel="stylesheet" href="https://jsdev.arcgis.com/4.32/esri/themes/light/main.css" />
  <script src="https://jsdev.arcgis.com/4.32/"></script>

  <!-- Load Map components from CDN-->
  <script type="module" src="https://jsdev.arcgis.com/map-components/4.32/arcgis-map-components.esm.js"></script>
</head>

<body>
  <arcgis-map item-id="ab61d3e738ea43cf83260d62ccf83389">
    <arcgis-zoom position="top-left"></arcgis-zoom>
    <arcgis-expand expanded position="top-left" group="top-left">
      <arcgis-legend></arcgis-legend>
    </arcgis-expand>
    <arcgis-expand position="top-left" group="top-left">
      <arcgis-layer-list></arcgis-layer-list>
    </arcgis-expand>
    <arcgis-expand position="top-left" group="top-left">
      <arcgis-editor></arcgis-editor>
    </arcgis-expand>
  </arcgis-map>

  <script>
    require([
      "esri/config"
    ], (esriConfig) => {
      esriConfig.portalUrl = "https://dev0032563.esri.com/portal/";
    });
  </script>
</body>
</html>
