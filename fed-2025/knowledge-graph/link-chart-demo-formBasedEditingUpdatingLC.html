                 * origin entity list handling
                 */
                originSearchResultList.addEventListener("calciteListChange", (e) => {
                    const selected = originSearchResultList.selectedItems;
                    console.log("selected", selected);
                    if (selected.length > 0) {
                        selectedOriginEntity = {
                            id: selected[0].getAttribute("data-id"),
                            name: selected[0].value
                        };
                        originEntityPropsDiv.innerHTML = "";
                        editRelBlock.disabled = false;
                        createRelProps();
                    }
                });
                /**
                 * destination entity list handling
                 */
                destSearchResultList.addEventListener("calciteListChange", (e) => {
                    const selected = destSearchResultList.selectedItems;
                    if (selected.length > 0) {
                        selectedDestEntity = {
                            id: selected[0].getAttribute("data-id"),
                            name: selected[0].value
                        };
                        editRelBlock.disabled = false;
                        createRelProps();
                        destEntityPropsDiv.innerHTML = "";
                        document.getElementById("dest-entity-label").innerHTML =
                            "Destination: " + selectedDestEntity.name;
                    }
                });
            };
            // a function to read the stream returned from the streaming search
            const readStream = async (streamingQueryResult, location) => {
                //create the reader
                let reader = streamingQueryResult.resultRowsStream.getReader();
                // let results = [];
                let result = false;
                //try to read the stream
                try {
                    while (true) {
                        //read the stream
                        const { done, value } = await reader.read();
                        //stop reader when the stream is done
                        if (done) {
                            if (!result) {
                                buildResultList(false, location);
                            }
                            break;
                        }
                        //create the output list from the read stream.
                        result = true;
                        buildResultList(value, location);
                    }
                    // return results;
                    // if there is an error in returning the stream or the stream is aborted
                }
                catch (err) {
                    if (err.name === "AbortError") {
                        console.log("Request aborted as expected");
                    }
                    else {
                        throw err;
                    }
                }
            };
        });
        /**
         * Lookup for the diferent input types to map to esri types
         */
        const inputLookup = (inputType) => {
            // console.log(inputType);
            switch (inputType) {
                case "number":
                case "esriFieldTypeNumber":
                case "esriFieldTypeSmallInteger":
                    return "calcite-input-number";
                default:
                    return "calcite-input";
            }
        };
        /**
         * create relationship property list
         */
        const createRelProps = () => {
            console.log("selected rel", selectedRelType);
            let props = relTypeProps[selectedRelType];
            relPropsDiv.innerHTML = `<br><h4>Create ${selectedRelType} relationship</h4>
    <calcite-label id="origin-entity-label"> Origin: ${selectedOriginEntity ? selectedOriginEntity.name : "please select or create an origin entity"}</calcite-label>`;
            console.log("entity", selectedOriginEntity);
            const noEdits = ["globalid", "objectid", "shape"];
            props.forEach((p, i) => {
                const inputType = inputLookup(p.fieldType);
                console.log(p);
                if (!noEdits.includes(p.name)) {
                    relPropsDiv.innerHTML += `<calcite-label>${p.name}<${inputType} class="rel-prop" type="${p.name}" field-type="${p.fieldType}"><${inputType}></calcite-label>`;
                }
            });
            relPropsDiv.innerHTML += ` <calcite-label id="dest-entity-label">Destination: Please select or create a destination entity </calcite-label>`;
        };
    });
});

		});
	</script>
