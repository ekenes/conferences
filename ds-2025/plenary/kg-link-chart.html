<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />

  <!-- Load Calcite -->
  <script type="module" src="https://js.arcgis.com/calcite-components/3.0.2/calcite.esm.js"></script>

  <!-- Load the ArcGIS Maps SDK for JavaScript core API -->
  <link rel="stylesheet" type="text/css" href="https://js.arcgis.com/4.32/esri/themes/light/main.css" />
  <script src="https://js.arcgis.com/4.32/"></script>

  <!-- Load map components -->
  <script type="module" src="https://js.arcgis.com/map-components/4.32/arcgis-map-components.esm.js"></script>

  <style>
    :root {
      --app-theme-color: #c45451;
      --popup-background-color: #f0d1ce;
    }

    html,
    body {
      background-color: var(--calcite-ui-foreground-2);
      --calcite-color-brand: var(--app-theme-color);
      --calcite-color-focus: var(--calcite-color-brand);
      padding: 0;
      margin: 0;
      width: 100vw;
      height: 100vh;
    }

    :focus {
      --calcite-color-brand: var(--app-theme-color);
      --calcite-color-focus: var(--calcite-color-brand);
      --calcite-color-brand-hover: #9a4340;
      --calcite-color-brand-press: #622b29;
      --calcite-color-focus: var(--calcite-color-brand);
    }

    #map-container {
      display: flex;
      width: 100%;
      height: 100%;
    }

    arcgis-link-chart {
      height: 100%;
    }

    #link-chart-panel {
      height: 100%;
    }

    #bottom-shell-panel {
      width: 100%;
      height: 0;
      --calcite-shell-panel-min-height: 60vh;
    }
  </style>
</head>

<body>
  <calcite-shell>
    <calcite-shell-panel slot="panel-start" position="start" id="shell-panel-start">
      <calcite-panel heading="Healthcare Access" id="panel-start">
        <calcite-block id="specialty-block" heading="Specialties"
          description="Click a facility and open its link chart to filter all entities connected to a specialty" disabled>
          <calcite-list id="specialty-list" selection-mode="single-persist"></calcite-list>
        </calcite-block>
        <calcite-block id="need-block" heading="Patients"
        description="Click a facility and open its link chart to view patients with highest needs" disabled>
          <calcite-label layout="inline">
            <calcite-switch id="highest-need-switch"></calcite-switch>
            Highest priority
          </calcite-label>
        </calcite-block>
        <calcite-block id="legend-block" heading="Legend" open>
          <arcgis-legend reference-element="arcgis-map"></arcgis-legend>
          <arcgis-legend reference-element="arcgis-link-chart" id="link-chart-legend"></arcgis-legend>
        </calcite-block>
      </calcite-panel>
    </calcite-shell-panel>
    <calcite-panel id="map-container">
      <arcgis-map item-id="35bc76dd4b99471cb24210bb2d1ef2e5"></arcgis-map>
    </calcite-panel>
    <calcite-shell-panel id="bottom-shell-panel" slot="panel-bottom" position="end" layout="horizontal" collapsed>
      <calcite-panel heading="Link chart" scale="s" closed closable id="link-chart-panel">
        <arcgis-link-chart item-id="00d1bdded9364ff28a895f10537c9d92" id="link-chart">
          <arcgis-link-chart-layout-switcher position="top-left"></arcgis-link-chart-layout-switcher>
        </arcgis-link-chart>
      </calcite-panel>
    </calcite-shell-panel>
  </calcite-shell>

  <script>
    require([
      "esri/config",
      "esri/core/reactiveUtils",
      "esri/symbols/support/cimSymbolUtils",
      "esri/renderers/support/jsonUtils",
      "esri/Color"
    ], (esriConfig, reactiveUtils, cimSymbolUtils, rendererUtils, Color) => {
      (async () => {

        const applySymbolAnimations = (cimSymbol, animateColor) => {
          cimSymbolUtils.applyCIMSymbolColor(cimSymbol, "black");

          // Add scale animation
          cimSymbol.data.symbol.animations = [{
            type: "CIMSymbolAnimationScale",
            scaleFactor: 2.5,
            animatedSymbolProperties: {
              type: "CIMAnimatedSymbolProperties",
              duration: 2,
              repeatDelay: 0,
              repeatType: "Oscillate",
              playAnimation: true,
              randomizeStartTime: false,
            }
          }];

          // Add color animation
          if (animateColor) {
            const toColor = new Color("orange").toJSON();

            cimSymbol.data.symbol.symbolLayers[0]
              .markerGraphics[0].symbol
              .symbolLayers
              .find(sl => sl.type === "CIMSolidFill").animations = [{
                type: "CIMSymbolAnimationColor",
                primitiveName: "colorOverride",
                animatedSymbolProperties: {
                  type: "CIMAnimatedSymbolProperties",
                  primitiveName: "animationOverride",
                  playAnimation: true,
                  randomizeStartTime: false,
                  repeatType: "Oscillate",
                  repeatDelay: 0,
                  duration: 2
                },
                toColor
              }];
          }
        }

        esriConfig.portalUrl = "https://knowledgegraph5.dev.geocloud.com/portal";

        const arcgisLinkChart = document.querySelector("arcgis-link-chart");
        const arcgisLinkChartLayoutSwitcher = document.querySelector("arcgis-link-chart-layout-switcher");
        const specialtyList = document.getElementById("specialty-list");
        const highestNeedSwitch = document.getElementById("highest-need-switch");
        const linkChartPanel = document.getElementById("link-chart-panel");
        const bottomShellPanel = document.getElementById("bottom-shell-panel");
        const arcgisMap = document.querySelector("arcgis-map");
        const specialtyBlock = document.getElementById("specialty-block");
        const needBlock = document.getElementById("need-block");

        const createSpecialtyList = (displayFilterInfo) => {
          displayFilterInfo.filters.forEach((filter) => {
            const listItem = document.createElement("calcite-list-item");
            listItem.label = filter.title;
            listItem.value = filter.id;
            specialtyList.appendChild(listItem);
            listItem.selected = filter.title === "All";
          });
        }

        arcgisMap.addEventListener("arcgisViewReadyChange", async () => {
          arcgisMap.popup.dockEnabled = true;
          arcgisMap.popup.dockOptions = {
            buttonEnabled: true,
            breakpoint: false,
            position: "top-left"
          };

          arcgisMap.constraints = {
            snapToZoom: false
          };

          const healthcareNetworkLayer = arcgisMap.map.layers.find(({ title }) => title === "Healthcare Network");
          await healthcareNetworkLayer.load();

          const patientLayerMap = healthcareNetworkLayer.layers.find(({ title }) => title === "Patients");
          patientLayerMap.popupEnabled = false;
          const patientLayerMapOriginalRenderer = patientLayerMap.renderer.clone();

          let activeLinkChartLayer;
          let patientLayerLinkChart;
          let conditionLayerLinkChart;
          let specialtyLayerLinkChart;
          let organizationLayerLinkChart;
          let providerLayerLinkChart;
          let hasConditionLayerLinkChart;
          let requiresLayerLinkChart;
          let specializesInLayerLinkChart;
          let worksAtLayerLinkChart;
          let displayFilterLayers;

          let patientLayerLinkChartOriginalRenderer;

          const resetDisplayFilters = () => {
            if (!displayFilterLayers || displayFilterLayers.some(layer => !layer)) {
              return;
            }
            displayFilterLayers.forEach((layer) => {
              if (layer.displayFilterInfo) {
                layer.displayFilterInfo.activeFilterId = null;
              }
            });
          };

          const resetRenderers = () => {
            if (!patientLayerMap || !patientLayerLinkChart) {
              return;
            }
            patientLayerMap.renderer = patientLayerMapOriginalRenderer;
            patientLayerLinkChart.renderer = patientLayerLinkChartOriginalRenderer;

          };

          const resetLinkChart = () => {
            if (!displayFilterLayers || displayFilterLayers.some(layer => !layer)) {
              return;
            }
            activeLinkChartLayer.layers.forEach((layer) => {
              if (layer) {
                layer.featureEffect = null;
              }
            });
          }

          const setFeatureEffect = (where, filterOnly) => {
            const selectedFeature = arcgisMap.popup.selectedFeature;
            const filter = {
              where,
              geometry: selectedFeature.geometry,
              distance: 2,
              units: "kilometers"
            };

            patientLayerMap.featureEffect = {
              filter,
              excludedEffect: filterOnly ? "opacity(0)" : "grayscale(100%) opacity(30%)",
              includedEffect: "drop-shadow(2px 2px 4px black)"
            };
          }

          const organizationLayer = arcgisMap.map.layers.find(({ title }) => title === "Facilities");
          await organizationLayer.load();
          const medicalCentersLayer = arcgisMap.map.layers.find(({ title }) => title === "Medical Facilities");

          const closeLinkChart = () => {
            bottomShellPanel.style.height = 0;
            bottomShellPanel.collapsed = true;
            linkChartPanel.closed = true;
            patientLayerMap.featureEffect = null;

            specialtyList.innerHTML = null;
            specialtyBlock.disabled = true;
            specialtyBlock.open = false;
            specialtyBlock.description = "Click a facility and open its link chart to filter all entities connected to a specialty";

            needBlock.disabled = true;
            needBlock.open = false;
            needBlock.description = "Click a facility and open its link chart to view patients with highest priority";
            highestNeedSwitch.checked = false;

            arcgisMap.popup.collapsed = false;
            arcgisMap.popup.focus();

            resetRenderers();
            resetDisplayFilters();
            resetLinkChart();
          };

          const openLinkChart = () => {
            if (patientLayerLinkChart && specialtyBlock.disabled) {
              createSpecialtyList(patientLayerLinkChart.displayFilterInfo);
            }
            const facilityName = arcgisMap.popup.selectedFeature.attributes.FACILITY_N;

            bottomShellPanel.style.height = "60vh";
            bottomShellPanel.collapsed = false;
            linkChartPanel.closed = false;

            specialtyBlock.disabled = false;
            specialtyBlock.open = true;
            specialtyBlock.description = facilityName;

            needBlock.disabled = false;
            needBlock.open = true;
            needBlock.description = "";

            arcgisMap.popup.collapsed = true;
            linkChartPanel.setFocus();

            setFeatureEffect();
          };

          linkChartPanel.addEventListener("calcitePanelClose", closeLinkChart);

          // Add link chart action to medical centers popup
          const medicalCentersPopupTemplate = medicalCentersLayer.popupTemplate.clone();
          medicalCentersPopupTemplate.actions = [{
            id: "view-link-chart",
            title: "View link chart",
            icon: "link-chart-expand",
            visible: true
          }];
          medicalCentersLayer.popupTemplate = medicalCentersPopupTemplate;

          reactiveUtils.on(
            () => arcgisMap.popup,
            "trigger-action", (event) => {
              if (event.action.id === "view-link-chart") {
                openLinkChart();
              }
            });

          reactiveUtils.watch(() => [arcgisMap.popup.visible, arcgisMap.popup.selectedFeature], () => {
            closeLinkChart();
          });

          arcgisLinkChart.addEventListener("arcgisViewReadyChange", async () => {
            arcgisLinkChart.map.basemap = "gray-vector";
            activeLinkChartLayer = arcgisLinkChart.map.activeLinkChartLayer;
            activeLinkChartLayer.effect = "drop-shadow(1px 1px 3px gray)";

            patientLayerLinkChart = activeLinkChartLayer.layers.find(({ title }) => title === "Patient");
            hasConditionLayerLinkChart = activeLinkChartLayer.layers.find(({ title }) => title === "HasCondition");
            providerLayerLinkChart = activeLinkChartLayer.layers.find(({ title }) => title === "Provider");
            specialtyLayerLinkChart = activeLinkChartLayer.layers.find(({ title }) => title === "Specialty");
            conditionLayerLinkChart = activeLinkChartLayer.layers.find(({ title }) => title === "Condition");
            organizationLayerLinkChart = activeLinkChartLayer.layers.find(({ title }) => title === "Organization");
            requiresLayerLinkChart = activeLinkChartLayer.layers.find(({ title }) => title === "Requires");
            specializesInLayerLinkChart = activeLinkChartLayer.layers.find(({ title }) => title === "SpecializesIn");
            worksAtLayerLinkChart = activeLinkChartLayer.layers.find(({ title }) => title === "WorksAt");

            displayFilterLayers = [
              patientLayerLinkChart,
              conditionLayerLinkChart,
              specialtyLayerLinkChart,
              organizationLayerLinkChart,
              providerLayerLinkChart,
              hasConditionLayerLinkChart,
              requiresLayerLinkChart,
              specializesInLayerLinkChart,
              worksAtLayerLinkChart
            ];

            patientLayerLinkChartOriginalRenderer = patientLayerLinkChart.renderer.clone();

            createSpecialtyList(patientLayerLinkChart.displayFilterInfo);

            const filterLinkChart = ({ filterId, useFeatureEffect }) => {
              setFeatureEffect(patientLayerLinkChart.displayFilterInfo.filters.find(({ id }) => id === filterId).where, highestNeedSwitch.checked);

              if (useFeatureEffect) {
                if (patientLayerLinkChart && patientLayerLinkChart.displayFilterInfo) {
                  patientLayerLinkChart.displayFilterInfo.activeFilterId = filterId;
                }
                if (filterId !== "All") {
                  activeLinkChartLayer.layers.forEach((layer) => {
                    if (layer && layer.displayFilterInfo) {
                      const where = layer.displayFilterInfo.filters.find(({ id }) => id === filterId).where;
                      layer.featureEffect = {
                        filter: {
                          where
                        },
                        excludedEffect: "grayscale(100%) opacity(30%)",
                        includedEffect: "drop-shadow(1px 1px 1px #303030)"
                      }
                    }
                  });
                } else {
                  resetLinkChart();
                }
                return;
              }

              displayFilterLayers.forEach((layer) => {
                if (layer && layer.displayFilterInfo) {
                  layer.displayFilterInfo.activeFilterId = filterId;
                }
              });

            };

            specialtyList.addEventListener("calciteListItemSelect", (event) => {
              const filterId = event.target.value;
              filterLinkChart({
                filterId,
                useFeatureEffect: true
              });
            });

            arcgisLinkChartLayoutSwitcher.addEventListener("arcgisSwitchLayout", async (event) => {
              const patientLayerLinkChartView = await arcgisLinkChart.whenLayerView(patientLayerLinkChart);
              await reactiveUtils.whenOnce(() => !patientLayerLinkChartView.updating);

              if (event.detail.layout === "geographic-organic-standard") {
                const { extent } = await patientLayerLinkChartView.queryExtent();
                arcgisLinkChart.extent = { "spatialReference": { "latestWkid": 3857, "wkid": 102100 }, "xmin": -9947848.035694744, "ymin": 5319558.131264363, "xmax": -9938436.726587147, "ymax": 5323905.487248077 };
              }
            });

            const legendLayerTitles = ["Organization", "Patient", "Specialty", "Provider", "Condition"];
            const legend = document.querySelector("#link-chart-legend");
            legend.layerInfos = activeLinkChartLayer.layers
              .filter(({ title }) => legendLayerTitles.indexOf(title) > -1)
              .map((layer) => {
                return {
                  layer
                };
              });

            highestNeedSwitch.addEventListener("calciteSwitchChange", (event) => {
              resetRenderers();

              // Animated Symbol Stuff - Link Chart

              if (highestNeedSwitch.checked) {
                const patientKGRenderer = patientLayerLinkChart.renderer.clone();
                const patientKGSymbol = patientKGRenderer.symbol;
                const animatedKGSymbol = patientKGSymbol.clone();
                applySymbolAnimations(animatedKGSymbol, true);

                const needsClassBreaksRenderer = {
                  type: "class-breaks",
                  field: "NeedScore",
                  defaultSymbol: patientKGSymbol,
                  classBreakInfos: [
                    {
                      maxValue: 0.005,
                      label: "Highest Priority",
                      symbol: animatedKGSymbol
                    }
                  ]
                };
                patientLayerLinkChart.renderer = needsClassBreaksRenderer;

                const patientRenderer = patientLayerMap.renderer.clone();
                const patientClassBreaks = patientRenderer.classBreakInfos.map(classBreak => classBreak.clone());
                const patientSymbol = patientClassBreaks[0].symbol;
                const animatedSymbol = patientSymbol.clone();
                applySymbolAnimations(animatedSymbol, true);

                patientClassBreaks.unshift({
                  minValue: 0,
                  maxValue: 0.005,
                  label: "Highest priority",
                  symbol: animatedSymbol
                });

                patientClassBreaks[1].minValue = 0.0051;

                patientRenderer.classBreakInfos = patientClassBreaks;
                patientLayerMap.renderer = patientRenderer;

                const featureEffect = patientLayerMap.featureEffect.clone();
                featureEffect.excludedEffect = "opacity(0)";
                patientLayerMap.featureEffect = featureEffect;
              } else {
                const featureEffect = patientLayerMap.featureEffect.clone();
                featureEffect.excludedEffect = "grayscale(100%) opacity(30%)";
                patientLayerMap.featureEffect = featureEffect;
              }
            });
          });
        });
      })();
    });
  </script>
</body>

</html>
